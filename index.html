<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سیستم قانون‌محور تشخیص دیابت</title>
    <style>
        body {
            font-family: "IRANSans", "Tahoma", "Arial", sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .positive {
            background-color: #e6f4ea;
            color: #27ae60;
        }
        .negative {
            background-color: #fce8e6;
            color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>سیستم قانون‌محور تشخیص دیابت</h1>

        <label for="glucose">مقدار گلوکز (Glucose):</label>
        <input type="number" id="glucose" step="0.01" placeholder="مثال: 120">

        <label for="bmi">شاخص توده بدنی (BMI):</label>
        <input type="number" id="bmi" step="0.01" placeholder="مثال: 30.5">

        <label for="age">سن (Age):</label>
        <input type="number" id="age" step="1" placeholder="مثال: 35">

        <label for="dpf">تابع شجره‌نامه دیابت (DiabetesPedigreeFunction):</label>
        <input type="number" id="dpf" step="0.001" placeholder="مثال: 0.5">

        <button onclick="ارزیابی_قوانین()">ارزیابی قوانین</button>

        <div id="result"></div>
    </div>

    <script>
        function ارزیابی_قوانین() {
            // دریافت مقادیر ورودی
            const Glucose = parseFloat(document.getElementById('glucose').value);
            const BMI = parseFloat(document.getElementById('bmi').value);
            const Age = parseFloat(document.getElementById('age').value);
            const DiabetesPedigreeFunction = parseFloat(document.getElementById('dpf').value);

            // اعتبارسنجی ورودی‌ها
            if (isNaN(Glucose) || isNaN(BMI) || isNaN(Age) || isNaN(DiabetesPedigreeFunction)) {
                alert('لطفاً همه‌ی فیلدها را به درستی پر کنید.');
                return;
            }

            const resultDiv = document.getElementById('result');

            // --- بررسی قوانین برای خروجی 1 (دیابت مثبت) ---
            let matchedRule = null;

            // قانون 1 برای 1
            if (Glucose > 101 && Glucose <= 154 && BMI > 43.300 && Age > 29) {
                matchedRule = "قانون 1 برای دسته مثبت (1)";
            }
            // قانون 2 برای 1
            else if (Glucose > 154) {
                matchedRule = "قانون 2 برای دسته مثبت (1)";
            }
            // قانون 3 برای 1
            else if (Glucose > 101 && BMI > 26.700 && DiabetesPedigreeFunction > 0.464 && Age > 29) {
                matchedRule = "قانون 3 برای دسته مثبت (1)";
            }

            if (matchedRule) {
                resultDiv.innerHTML = `نتیجه: <strong>1</strong> (احتمال دیابت)<br>طبق ${matchedRule}`;
                resultDiv.className = "positive";
                return;
            }

            // --- اگر هیچ‌یک از قوانین مثبت اعمال نشد، خروجی 0 است (پیش‌فرض) ---
            resultDiv.innerHTML = `نتیجه: <strong>0</strong> (بدون احتمال دیابت)<br>(طبق مقدار پیش‌فرض یا قوانین منفی)`;
            resultDiv.className = "negative";
        }
    </script>
</body>
</html>
